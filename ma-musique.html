<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Musique - M3'Music</title>
  <link rel="stylesheet" href="music.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="db.js" defer></script>
  <style>
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .tab-btn.active {
      background: #e91e63;
    }
    .music-list {
      list-style: none;
      padding: 0;
    }
    .music-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #333;
      gap: 15px;
    }
    .music-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 5px;
    }
    .music-item-info {
      flex: 1;
    }
    .music-item-title {
      font-weight: bold;
      color: white;
    }
    .music-item-artist {
      color: #888;
      font-size: 0.9em;
    }
    .music-item-actions button {
      background: none;
      border: none;
      color: #e91e63;
      cursor: pointer;
      font-size: 1.2em;
      padding: 5px;
    }
    .empty-message {
      text-align: center;
      color: #888;
      padding: 40px;
    }
  </style>
</head>
<body>
  <header class="music-header">
    <a href="index.html" style="color: white; text-decoration: none;">
      <i class="fas fa-arrow-left"></i> Retour
    </a>
    <h1>Ma Musique</h1>
  </header>

  <main class="music-content">
    <div class="tabs">
      <button class="tab-btn active" data-tab="favorites">❤️ Favoris</button>
      <button class="tab-btn" data-tab="history">🕐 Historique</button>
    </div>

    <div id="favorites-tab" class="tab-content">
      <h2>Mes Favoris</h2>
      <ul class="music-list" id="favorites-list">
        <li class="empty-message">Aucun favori pour le moment</li>
      </ul>
    </div>

    <div id="history-tab" class="tab-content" style="display: none;">
      <h2>Historique d'écoute</h2>
      <button id="clear-history" style="background: #e91e63; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px;">
        <i class="fas fa-trash"></i> Vider l'historique
      </button>
      <ul class="music-list" id="history-list">
        <li class="empty-message">Aucun historique pour le moment</li>
      </ul>
    </div>
  </main>

  <script>
    // Initialiser la base de données
    document.addEventListener('DOMContentLoaded', async () => {
      await window.M3MusicDB.initDB();
      loadFavorites();
      loadHistory();
    });

    // Gestion des onglets
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        btn.classList.add('active');
        document.getElementById(`${btn.dataset.tab}-tab`).style.display = 'block';
      });
    });

    // Charger les favoris
    async function loadFavorites() {
      const favorites = await window.M3MusicDB.getFavorites();
      const list = document.getElementById('favorites-list');
      
      if (favorites.length === 0) {
        list.innerHTML = '<li class="empty-message">Aucun favori pour le moment</li>';
        return;
      }

      list.innerHTML = favorites.map(song => `
        <li class="music-item">
          <img src="${song.image || 'rap.png'}" alt="${song.title}">
          <div class="music-item-info">
            <div class="music-item-title">${song.title}</div>
            <div class="music-item-artist">${song.artist}</div>
          </div>
          <div class="music-item-actions">
            <button onclick="removeFavorite('${song.id}')" title="Retirer des favoris">
              <i class="fas fa-heart"></i>
            </button>
            <button onclick="playSong('${song.src}')" title="Écouter">
              <i class="fas fa-play"></i>
            </button>
          </div>
        </li>
      `).join('');
    }

    // Charger l'historique
    async function loadHistory() {
      const history = await window.M3MusicDB.getHistory();
      const list = document.getElementById('history-list');
      
      if (history.length === 0) {
        list.innerHTML = '<li class="empty-message">Aucun historique pour le moment</li>';
        return;
      }

      list.innerHTML = history.map(song => `
        <li class="music-item">
          <img src="${song.image || 'rap.png'}" alt="${song.title}">
          <div class="music-item-info">
            <div class="music-item-title">${song.title}</div>
            <div class="music-item-artist">${song.artist}</div>
          </div>
          <div class="music-item-actions">
            <button onclick="playSong('${song.src}')" title="Écouter">
              <i class="fas fa-play"></i>
            </button>
          </div>
        </li>
      `).join('');
    }

    // Retirer un favori
    async function removeFavorite(id) {
      await window.M3MusicDB.removeFromFavorites(id);
      loadFavorites();
    }

    // Vider l'historique
    document.getElementById('clear-history').addEventListener('click', async () => {
      if (confirm('Vider tout l\'historique ?')) {
        await window.M3MusicDB.clearHistory();
        loadHistory();
      }
    });

    // Fonction pour lire une chanson (à adapter selon votre lecteur)
    function playSong(src) {
      alert('Lecture: ' + src);
      // Implémenter selon votre lecteur existant
    }
  </script>
</body>
</html>
